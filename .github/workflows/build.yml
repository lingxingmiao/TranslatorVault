name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew clean build verifyPluginJar --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: TranslatorVault
          path: build/libs/*.jar
          if-no-files-found: error

