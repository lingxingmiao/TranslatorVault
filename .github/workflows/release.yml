name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew clean build verifyPluginJar --no-daemon --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          generate_release_notes: true

