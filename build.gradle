plugins {
    id 'java'
}

version = '1.1.1'
group = 'me.fengming.translatorvault'

repositories {
    mavenCentral()
}

def vaultPatcherJar = file('libs/vaultpatcher-1.5.4-api.jar')

dependencies {
    // Vault Patcher is provided by the game/mod at runtime. The plugin jar must
    // not bundle it.
    compileOnly files(vaultPatcherJar)
    compileOnly 'com.google.code.gson:gson:2.2.4'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
    disableAutoTargetJvm()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

jar {
    archiveBaseName = 'translatorvault'
    manifest {
        attributes(
                'VaultPatcherPlugin': 'me.fengming.translatorvault.TranslatorVaultPlugin',
                'Implementation-Title': 'TranslatorVault',
                'Implementation-Version': project.version
        )
    }
}

task verifyPluginJar {
    dependsOn jar
    doLast {
        def jarFile = jar.archiveFile.get().asFile
        def entries = new java.util.zip.ZipFile(jarFile).withCloseable { it.entries().collect { e -> e.name } }
        if (!entries.contains('me/fengming/translatorvault/TranslatorVaultPlugin.class')) {
            throw new GradleException('Plugin entrypoint is missing from the jar')
        }
        if (entries.any { it.startsWith('me/fengming/vaultpatcher_asm/') }) {
            throw new GradleException('Plugin jar must not bundle VaultPatcher classes')
        }
        println "Plugin jar OK: ${jarFile.name} (${entries.size()} entries)"
    }
}

